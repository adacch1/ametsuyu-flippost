# Self-hosted ntfy server for the Z Flip 5 modem: private push notifications
# (thermal and data-cap alerts). Reach it over the tailnet with `tailscale serve`.
services:
  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: zf5-ntfy
    command: serve
    volumes:
      - ./ntfy/server.yml:/etc/ntfy/server.yml:ro
      - ntfy-cache:/var/cache/ntfy
      - ntfy-lib:/var/lib/ntfy
    ports:
      # Bind to loopback only; expose over the tailnet with `tailscale serve`
      # rather than publishing on every host interface (0.0.0.0). This removes
      # the LAN/public attack surface even before any host firewall.
      - "127.0.0.1:8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:80/v1/health | grep -q healthy || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3

volumes:
  ntfy-cache:
  ntfy-lib:
